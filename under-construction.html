<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Under Construction | SyloTea</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="SyloTea, Under Construction" name="keywords">
    <meta content="This page is currently under construction. We're working hard to bring you something amazing!" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- SyloTea Stylesheet -->
    <link href="css/sylo-style.css" rel="stylesheet">

    <style>
        :root {
            --primary: #13a14f;
            --secondary: #FB9F38;
            --light: #F5F8F2;
            --dark: #252C30;
        }

        body {
            font-family: 'Merienda', cursive;
            background: linear-gradient(135deg, var(--primary) 0%, #0f8640 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="2" fill="white" opacity="0.1"/></svg>');
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .construction-container {
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            margin: 20px;
        }

        .construction-icon {
            font-size: 100px;
            color: var(--secondary);
            margin-bottom: 20px;
            animation: swing 2s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% {
                transform: rotate(-10deg);
            }
            50% {
                transform: rotate(10deg);
            }
        }

        .construction-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .construction-subtitle {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .construction-message {
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 10px;
            animation: loading 2s ease-in-out infinite;
            width: 70%;
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(150%);
            }
        }

        .btn-home {
            background-color: var(--primary);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(19, 161, 79, 0.3);
        }

        .btn-home:hover {
            background-color: #0f8640;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(19, 161, 79, 0.4);
        }

        .features-list {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--dark);
        }

        .feature-icon {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 14px;
            font-weight: 600;
        }

        /* Animated construction elements */
        .construction-element {
            position: absolute;
            font-size: 30px;
            opacity: 0.15;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        .element-1 {
            top: 5%;
            left: 5%;
            animation-delay: 0s;
            color: var(--secondary);
        }

        .element-2 {
            top: 10%;
            right: 8%;
            animation-delay: 1s;
            color: var(--light);
        }

        .element-3 {
            bottom: 10%;
            left: 8%;
            animation-delay: 2s;
            color: var(--light);
        }

        .element-4 {
            bottom: 5%;
            right: 5%;
            animation-delay: 3s;
            color: var(--secondary);
        }

        @media (max-width: 768px) {
            .construction-title {
                font-size: 32px;
            }

            .construction-subtitle {
                font-size: 20px;
            }

            .construction-message {
                font-size: 16px;
            }

            .btn-home {
                padding: 12px 30px;
                font-size: 16px;
            }

            .features-list {
                gap: 20px;
            }

            .feature-icon {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <!-- Decorative Elements -->
    <i class="fas fa-tools construction-element element-1"></i>
    <i class="fas fa-hard-hat construction-element element-2"></i>
    <i class="fas fa-hammer construction-element element-3"></i>
    <i class="fas fa-wrench construction-element element-4"></i>

    <!-- Construction Container -->
    <div class="construction-container">
        <div class="construction-icon">
            <i class="fas fa-hard-hat"></i>
        </div>
        <h1 class="construction-title">Under Construction</h1>
        <p class="construction-subtitle">We're Brewing Something Special! ☕</p>
        <p class="construction-message">
            Our team is working hard to bring you an amazing experience. 
            This page is currently under construction, but we'll be back soon with something fresh and exciting!
        </p>

        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>

        <!-- Features -->
        <div class="features-list">
            <div class="feature-item">
                <i class="fas fa-leaf feature-icon"></i>
                <span class="feature-text">Fresh Products</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-shipping-fast feature-icon"></i>
                <span class="feature-text">Fast Delivery</span>
            </div>
            <div class="feature-item">
                <i class="fas fa-star feature-icon"></i>
                <span class="feature-text">Premium Quality</span>
            </div>
        </div>

        <!-- Action Button -->
        <div class="mt-4">
            <a href="index.html" class="btn-home">
                <i class="fas fa-home me-2"></i>Back to Home
            </a>
        </div>

        <!-- Contact Info -->
        <p class="construction-message mt-4 mb-0">
            <i class="fas fa-info-circle"></i> Need help? 
            <a href="contact.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Contact us</a>
        </p>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
