<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>404 - Page Not Found | SyloTea</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="SyloTea, 404, Page Not Found" name="keywords">
    <meta content="The page you are looking for is not available or under construction." name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- SyloTea Stylesheet -->
    <link href="css/sylo-style.css" rel="stylesheet">

    <style>
        :root {
            --primary: #13a14f;
            --secondary: #FB9F38;
            --light: #F5F8F2;
            --dark: #252C30;
        }

        body {
            font-family: 'Merienda', cursive;
            background: linear-gradient(135deg, var(--light) 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .error-container {
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .error-404 {
            font-size: 150px;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0px rgba(19, 161, 79, 0.1);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .error-icon {
            font-size: 120px;
            color: var(--secondary);
            margin-bottom: 20px;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .error-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-home {
            background-color: var(--primary);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(19, 161, 79, 0.3);
        }

        .btn-home:hover {
            background-color: #0f8640;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(19, 161, 79, 0.4);
        }

        .btn-secondary-link {
            background-color: var(--secondary);
            color: var(--dark);
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(251, 159, 56, 0.3);
            margin-left: 15px;
        }

        .btn-secondary-link:hover {
            background-color: #e88f2e;
            color: var(--dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 159, 56, 0.4);
        }

        /* Decorative elements */
        .tea-leaf {
            position: absolute;
            font-size: 40px;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(180deg);
            }
        }

        .tea-leaf-1 {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            color: var(--primary);
        }

        .tea-leaf-2 {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
            color: var(--secondary);
        }

        .tea-leaf-3 {
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
            color: var(--primary);
        }

        .tea-leaf-4 {
            bottom: 10%;
            right: 10%;
            animation-delay: 3s;
            color: var(--secondary);
        }

        .countdown-text {
            font-size: 14px;
            color: #6c757d;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .error-404 {
                font-size: 100px;
            }

            .error-title {
                font-size: 28px;
            }

            .error-message {
                font-size: 16px;
            }

            .btn-home, .btn-secondary-link {
                padding: 12px 30px;
                font-size: 16px;
                margin: 10px 5px;
            }

            .tea-leaf {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <!-- Decorative Tea Leaves -->
    <i class="fas fa-leaf tea-leaf tea-leaf-1"></i>
    <i class="fas fa-leaf tea-leaf tea-leaf-2"></i>
    <i class="fas fa-leaf tea-leaf tea-leaf-3"></i>
    <i class="fas fa-leaf tea-leaf tea-leaf-4"></i>

    <!-- Error Container -->
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-mug-hot"></i>
        </div>
        <div class="error-404">404</div>
        <h1 class="error-title">Oops! Page Not Found</h1>
        <p class="error-message">
            The page you are looking for might be under construction, moved, or doesn't exist. 
            Let's get you back to exploring our fresh products!
        </p>
        <div class="mt-4">
            <a href="index.html" class="btn-home">
                <i class="fas fa-home me-2"></i>Back to Home
            </a>
            <a href="contact.html" class="btn-secondary-link">
                <i class="fas fa-envelope me-2"></i>Contact Us
            </a>
        </div>
        <p class="countdown-text">
            <i class="fas fa-info-circle"></i> Redirecting to home page in <span id="countdown">10</span> seconds...
        </p>
    </div>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Countdown and Redirect Script -->
    <script>
        // Countdown timer
        let countdown = 10;
        const countdownElement = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000);

        // Stop countdown if user clicks any link
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                clearInterval(timer);
            });
        });
    </script>
</body>

</html>
